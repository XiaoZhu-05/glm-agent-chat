<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLM Agent Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234e8cff'/%3E%3Cstop offset='1' stop-color='%232a5cf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M10 22V10h6.2c2.6 0 4.3 1.4 4.3 3.6 0 1.5-.8 2.6-2.1 3.1L22 22h-3.4l-2.9-4.8h-2.3V22H10zm3.4-7.4h2.5c1 0 1.6-.5 1.6-1.4s-.6-1.4-1.6-1.4h-2.5v2.8z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/github.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="side-head">
        <div class="logo">GLM</div>
        <div class="side-title">Agent Chat</div>
      </div>
      <button id="new-chat-btn" title="开始新的对话">
        <span class="plus">＋</span> 新的对话
      </button>
      <nav id="conv-list" aria-label="历史对话"></nav>
      <div class="side-foot">
        <div class="foot-row" id="workspace-row" title="">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
          <span id="workspace-path">工作区加载中…</span>
        </div>
        <div class="foot-row dim">DeepSeek-Harness 风格 · 深度思考 + 工具调用</div>
      </div>
    </aside>

    <!-- 主区域 -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <h1 id="conv-title">新的对话</h1>
        </div>
        <div class="topbar-right">
          <label class="model-label" for="model-select">模型</label>
          <div class="model-select-wrap">
            <select id="model-select"></select>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </header>

      <div id="chat-scroll">
        <div id="chat" class="chat-col"></div>
      </div>

      <div id="input-area">
        <div class="input-wrap">
          <div class="input-box" id="input-box">
            <div id="attach-bar" class="attach-bar" hidden></div>
            <textarea id="input" rows="1" placeholder="给 GLM Agent 发送消息，例如：看看工作区里有什么文件"></textarea>
            <div class="input-actions">
              <div class="input-tools">
                <button id="attach-btn" class="tool-icon-btn" type="button" title="上传图片（PNG/JPG/WEBP，≤5MB）或文档（PDF/XLSX/CSV/TXT/FASTA，≤10MB）">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="attach-input" hidden multiple accept="image/png,image/jpeg,image/webp,.pdf,.xlsx,.xls,.csv,.txt,.md,.json,.fasta,.fa,.fas" />
                <button id="plan-toggle" class="pill-toggle" type="button" title="规划模式：先给出计划，经你确认后再执行">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                  规划模式
                </button>
                <span id="key-status" class="key-status"></span>
              </div>
              <div class="input-buttons">
                <button id="stop-btn" class="stop-btn" hidden title="停止生成">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button id="send-btn" class="send-btn" title="发送（Enter）">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="disclaimer">内容由 AI 生成，请仔细甄别 · Agent 会在本地工作区中执行命令与文件操作</p>
        </div>
      </div>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
